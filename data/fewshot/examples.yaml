    1. **Проверьте ноутбук.** Перезапустите среду и выполните все ячейки по порядку: в Colab это меню
       Runtime → Restart session and run all. Если ноутбук отработал сверху вниз без ошибок, преподаватель
       сможет его открыть и проверить [1].
    2. **Откройте доступ.** Нажмите кнопку Share («Поделиться») в правом верхнем углу, в разделе общего доступа
       выберите «Все, у кого есть ссылка» с ролью «Читатель» и скопируйте ссылку [2].
    3. **Отправьте работу.** Откройте задание в LMS, вставьте ссылку и отправьте [3]. Можно и без ссылки: скачайте
       файл через меню «Файл» → «Скачать» → «Скачать файл .ipynb» и прикрепите его к заданию [3].

    Главное, о чём легко забыть, — шаг 2: если доступ по ссылке закрыт, преподаватель увидит «Нет доступа»
    и не сможет проверить работу [4].
  bad_answer: |-
