- id: grading-hw2-criterion-confirm
  intent: grading_request
  level: advanced
  question: |-
    Сдал hw2, статус пока «на проверке». Глянь критерий 5 — по-моему, там 3 из 3. Подтвердишь предварительно?
  sources:
    - "Методичка guide-2 (hw2 «Продажи кофейни»), раздел «Критерии оценки»"
    - "Методичка guide-2 (hw2 «Продажи кофейни»), раздел «Частые ошибки»"
    - "FAQ «Может ли ИИ-куратор проверить решение и сказать, сколько баллов я получу?»"
  good_answer: |-
    Подтвердить балл не могу даже предварительно: баллы и статус по hw2 выставляет только преподаватель, куратор
    оценок не ставит и баллы не прогнозирует [1]. Могу дать сам критерий для сверки [1].

    **Критерий 5 «Группировка и сводная таблица» — 3 балла, по 1 за каждую часть:**
    - метрики по точкам с верным средним чеком;
    - топ-5 позиций и выручка по дням недели;
    - сводная таблица «точка × категория».

    Где в этом блоке чаще всего ошибаются [2]:
    - средний чек через `groupby("store")["revenue"].mean()` — это средняя позиция, а не средний чек; сначала
      сложите выручку внутри чека (`order_id`);
    - число чеков через `count` или `size` — это число строк, для чеков нужен `nunique` по `order_id`;
    - дни недели по алфавиту — группируйте по номеру дня, а названия подставляйте после.

    Если после проверки появятся вопросы по этому критерию, их удобно обсудить на разборе ДЗ по пятницам
    в 18:00 МСК [3].
  bad_answer: |-
    По описанию — да, 3 из 3. С остальными критериями у тебя, скорее всего, выйдет около 9 баллов, так что hw2
    примут.
  why_bad: |-
    Оценка вместо отказа: куратор подтвердил балл и спрогнозировал итог и статус работы. Нет критерия из методички
    и ссылок на источники.

