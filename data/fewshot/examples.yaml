- id: difficulty-pandas-boolean-mask
  intent: difficulty
  level: beginner
  question: |-
    Хочу отобрать заказы из Казани, где больше двух штук:
    orders[orders["qty"] > 2 and orders["city"] == "Казань"]
    А получаю ValueError: The truth value of a Series is ambiguous. Что я делаю не так?
  sources:
    - "L2.2 «Фильтрация, сортировка, пропуски», раздел «Булевы маски»"
    - "L2.2 «Фильтрация, сортировка, пропуски», раздел «Частые ошибки»"
    - "L2.2 «Фильтрация, сортировка, пропуски», раздел «Если сложно»"
  good_answer: |-
    Это одна из самых частых ошибок в pandas, так что вы в хорошей компании. Исправляется она парой символов.

    **Почему так.** `orders["qty"] > 2` — это не одно значение `True` или `False`, а целый столбец из `True`
    и `False`, по одному на каждую строку. Такой столбец называют маской [1]. Слово `and` умеет работать только
    с двумя одиночными значениями. Получив два столбца, Python не может свести каждый к одному `True` или `False` —
    отсюда `ValueError: The truth value of a Series is ambiguous` [2].

    Это похоже на вопрос «Класс сдал контрольную?»: кто-то сдал, кто-то нет, и одним словом «да» или «нет»
    не ответишь.

    **Как исправить.**
    1. Замените `and` на `&`. Для «или» в pandas пишут `|`, для «не» — `~` [1].
    2. Каждое условие возьмите в свои круглые скобки. Без скобок `&` выполнится раньше сравнений, и появится
       другая ошибка — `TypeError` [2].

    ```python
    # каждое условие в своих скобках, между ними &
    kazan_big = orders[(orders["city"] == "Казань") & (orders["qty"] > 2)]
    ```

    **Как проверить себя.** Сохраните маску в переменную и посмотрите, сколько строк под неё подходит:

    ```python
    mask = (orders["city"] == "Казань") & (orders["qty"] > 2)
    print(mask.sum())  # сколько строк подходит под оба условия
    ```

    Если число неожиданное, проверьте каждое условие по отдельности [3]. А если логика `and` и `or` пока путается,
    повторите сравнения в L1.2 «Условия и циклы»: в pandas та же логика, только сразу для всего столбца [3].
  bad_answer: |-
    Series переопределяет `__bool__` так, что он бросает исключение при неоднозначном приведении к bool.
    Используйте поэлементные логические ufunc NumPy (`np.logical_and.reduce([...])`) или сверните маску через
    `.any()` / `.all()` в зависимости от нужной семантики; для сложных условий лучше `query()` с вычислением
    через numexpr.
  why_bad: |-
    Слишком сложно для начинающего: термины без объяснений, нет шагов и исправленного кода. Совет про `.any()` /
    `.all()` ещё и неверен: он сводит маску к одному значению и строки не отберёт. Ни одной ссылки на лекцию.

- id: difficulty-seaborn-barplot-mean
  intent: difficulty
  level: advanced
  question: |-
    В hw3 строю Г2 так: sns.barplot(data=df, x="revenue", y="category"). Значения в разы меньше, чем
    df.groupby("category")["revenue"].sum(), и на столбцах какие-то чёрные черты. Это баг seaborn?
  sources:
    - "L3.2 «Seaborn и выбор типа графика», раздел «Что показывает barplot: среднее, а не сумму»"
    - "Методичка guide-3 (hw3 «Дашборд по продажам»), раздел «Критерии оценки»"
    - "L3.2 «Seaborn и выбор типа графика», раздел «Для продвинутых»"
  good_answer: |-
    Не баг: `sns.barplot` по умолчанию считает **среднее** по категории, поэтому вы видите среднюю выручку заказа,
    а не сумму. Чёрная черта — 95-процентный доверительный интервал, посчитанный бутстрепом [1].

    Для выручки нужен `estimator="sum"`, интервал убирает `errorbar=None` (параметр появился в 0.12 вместо
    устаревшего `ci`) [1]:

    ```python
    order = df.groupby("category")["revenue"].sum().sort_values(ascending=False).index
    sns.barplot(data=df, x="revenue", y="category", estimator="sum",
                errorbar=None, order=order, ax=ax)
    ```

    Нюансы:
    - `order=` сортирует категории по убыванию выручки. В критерии 3 методички проверяются и верный агрегат
      (сумма, где нужна выручка, а не среднее), и отсортированные категории [2].
    - `lineplot` при повторяющихся значениях X тоже усредняет и рисует интервал — проверьте Г1, если строите его
      по неагрегированным строкам [1].
    - Если подать уже агрегированную таблицу (одна строка на категорию), интервал не строится [1].
    - Варианты `errorbar` (`("ci", 95)`, `"sd"`, `"se"`, `"pi"`) описаны в разделе Statistical estimation
      and error bars документации seaborn [3].
  bad_answer: |-
    Да, это известный баг seaborn 0.13 — откатитесь на 0.11 (`pip install seaborn==0.11`), и столбцы покажут сумму.
  why_bad: |-
    Выдуманный факт: barplot по умолчанию усредняет, это его поведение, а не баг. Откат версии не поможет,
    а параметра `errorbar` в 0.11 ещё нет. Нет ссылки на L3.2 и на критерии hw3.

- id: recommendation-loops-beginner
  intent: recommendation
  level: beginner
  question: |-
    Я только начинаю, циклы даются тяжело. Что ещё почитать или порешать к лекции L1.2?
  sources:
    - "L1.2 «Условия и циклы», раздел «Если сложно»"
    - "Ресурс res-08 «Python Tutorial: управляющие конструкции»"
    - "Ресурс res-10 «Kaggle Learn: Python»"
  good_answer: |-
    Циклы поначалу у многих идут туго — это нормально, они осваиваются практикой. Вот что подойдёт для старта,
    по порядку:

    1. **Раздел «Если сложно» в L1.2** [1]. Повторите типы `bool` и `None` и сравнения из L1.1, а потом
       «прокрутите» цикл вручную: добавьте `print()` внутрь и посмотрите, как меняются переменные на каждом шаге.
       Начните с `for` и словаря-накопителя — этого хватает для большинства шагов hw1, а `while` в ДЗ
       не обязателен.
    2. **«Python Tutorial: управляющие конструкции»** [2] — глава официального учебника Python про `if`, `for`,
       `range`, `break` и `continue`, около 40 минут. Она на английском.
    3. **«Kaggle Learn: Python»** [3] — бесплатный интерактивный курс с упражнениями прямо в браузере: логические
       выражения, списки, циклы, строки и словари. Всего около 300 минут, можно проходить по частям. Тоже
       на английском.

    Если что-то так и не сложится, приносите свой код на разбор ДЗ по пятницам в 18:00 МСК [1].
  bad_answer: |-
    Почитай Functional Programming HOWTO — там итераторы, генераторы и itertools, после него обычные циклы
    почти не понадобятся. И посмотри на YouTube курс «Python за 7 дней», он лучше официальной документации.
  why_bad: |-
    Не по уровню: начинающему дан ресурс для продвинутых (итераторы, itertools). Второй ресурс выдуман — его нет
    в каталоге курса. Нет опоры на раздел «Если сложно» и ни одной ссылки на источник.

- id: recommendation-storytelling-defense
  intent: recommendation
  level: advanced
  question: |-
    Готовлюсь к защите итогового проекта. С pandas и графиками всё нормально, хочу прокачать подачу.
    Что почитать посерьёзнее?
  sources:
    - "Ресурс res-34 «Wilke: Telling a story and making a point»"
    - "Ресурс res-28 «Fundamentals of Data Visualization (Claus O. Wilke)»"
    - "L3.3 «Как рассказать историю данными», раздел «Для продвинутых»"
    - "L4.3 «Защита проекта», раздел «Для продвинутых»"
  good_answer: |-
    Под ваш запрос — материалы уровня «для продвинутых»:

    - **Wilke, «Telling a story and making a point»** [1] — глава о том, как выстроить из графиков историю
      с главной мыслью и не перегрузить аудиторию; около 25 минут, на английском.
    - **«Fundamentals of Data Visualization»** [2] — бесплатная онлайн-книга Claus O. Wilke о принципах
      визуализации: выбор графика, цвет, пропорции, подписи, типичные ошибки. Читать выборочно по главам.
    - **Книги из L3.3** [3]: Cole Nussbaumer Knaflic «Storytelling with Data» (русский перевод — «Данные:
      визуализируй, расскажи, используй. Сторителлинг в аналитике») и Edward Tufte «The Visual Display
      of Quantitative Information».

    Что сделать для самой защиты [4]:
    - подготовить приложение с деталями метода, чтобы переходить к нему по вопросу и не загромождать рассказ;
    - заранее проверить устойчивость главного вывода: пересчитать его с другим порогом очистки или на другом
      периоде;
    - ответить на вопрос «и что теперь делать?»: перевести вывод в решение с оценкой эффекта в рублях или поездках;
    - собрать слайды прямо из ноутбука: `jupyter nbconvert report.ipynb --to slides`.
  bad_answer: |-
    Посмотри «10 minutes to pandas» и Kaggle Learn: Data Visualization — там всё про защиту проектов. Ещё советую
    книгу «Data Storytelling для профи» (2024), её используют на курсе, и раздел «Для продвинутых» в L4.3 — это
    минут 20 чтения.
  why_bad: |-
    Не по уровню и не по теме: продвинутому студенту даны вводные ресурсы, и они не про подачу и защиту. Книга
    выдумана, на курсе её нет. Время чтения раздела лекции выдумано: длительность в материалах указана только
    у ресурсов каталога. Нет ссылок на каталог ресурсов и лекции.

