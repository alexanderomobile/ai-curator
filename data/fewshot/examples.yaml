# Few-shot примеры для ИИ-куратора курса «Python для анализа данных» (поток «Ноябрь-2026», «Академия Данных»).
#
# Генерация (BRIEF, раздел 4, п. 6) берёт 2-3 примера с тем же intent, что определил анализ запроса,
# и показывает модели хороший ответ, плохой ответ и пояснение, чем плох второй.
#
# Поля каждого примера:
#   id          — уникальный идентификатор: <intent>-<коротко о вопросе>
#   intent      — deadline | difficulty | recommendation | organizational | grading_request | schedule_change |
#                 off_topic | no_answer (по 2 примера на сценарий: один beginner, один advanced; у deadline ещё
#                 пара с условием revision)
#   level       — beginner | advanced: уровень студента, под который написан хороший ответ
#   tags        — необязательно: условия, при которых пара уместна (revision — у студента задание на доработке);
#                 пара с условием идёт в промпт только при нём и тогда — первой в своём сценарии
#   question    — вопрос студента
#   sources     — на что опираются ссылки [1], [2] ... в good_answer: лекция «L2.2 «...», раздел «...»»,
#                 методичка «Методичка guide-N (...), раздел «...»», «FAQ «вопрос»», «LMS: задания (...)»,
#                 «LMS: расписание (...)», ресурс «Ресурс res-NN «название»» (id из data/resources/resources.csv).
#                 В промпт поле передаётся строкой «Материалы примера: [1] …; [2] …» (curator/fewshot.py,
#                 Example.sources_text; шаблон — curator/prompts/context.md, блок fewshot_item): модель видит,
#                 на что опираются номера в хорошем ответе. Ещё по нему проверяются ссылки и опора на материалы
#   good_answer — ответ куратора: тон наставника, по уровню; ссылки [1], [2] ... по порядку списка sources;
#                 блок «Источники» в конце НЕ пишется — его добавляет код из реально использованных источников
#   bad_answer  — типичная ошибка: выдуманный факт, оценка вместо отказа, перенос срока, нет ссылок,
#                 слишком сложно для начинающего, не тот уровень ресурсов, выход из роли
#   why_bad     — коротко, почему плохой ответ плох
#
# Правила, которые показывают примеры:
#   - все факты в good_answer — только из data/kb, data/lms и data/resources;
#   - deadline: точная дата и время из LMS; «осталось N дней M часов» модель не считает и не округляет («ровно»,
#     «целых» не добавляет) — остаток подставляет код из данных LMS (curator.lms считает от текущего времени МСК),
#     в примере это сказано прямо;
#   - recommendation: 2-3 пункта под уровень; время («около 40 минут») — только у ресурса каталога, где оно
#     указано в resources.csv, у разделов лекций длительности нет;
#   - grading_request: отказ ставить или прогнозировать баллы + критерии из методички;
#   - schedule_change: отказ менять срок + правило переноса из FAQ;
#   - no_answer: честно «в материалах курса этого нет» + к кому обратиться;
#   - off_topic: вежливый возврат к курсу.
#
# Проверка формата: YAML разбирается, intent'ы покрыты, каждая метка источника есть в материалах,
# каждая ссылка [n] указывает на существующий источник и каждый источник процитирован.

- id: deadline-hw1-timezone
  intent: deadline
  level: beginner
  question: |-
    Когда нужно сдать первую домашку? Я живу в Калининграде, боюсь перепутать время.
  sources:
    - "LMS: задания (hw1)"
    - "FAQ «По какому времени считаются дедлайны?»"
    - "LMS: расписание (review-02)"
  # N в ответе — число дней из контекста LMS: его считает код от текущей даты, модель дни не считает.
  good_answer: |-
    Хорошо, что уточняете заранее: со временем действительно легко запутаться.

    ДЗ hw1 «Анализ списка покупок» нужно сдать до **15 ноября 2026 года, 23:59 по московскому времени** [1].
    До дедлайна осталось N дней M часов — так посчитала система по данным LMS на текущий момент [1].

    Все сроки курса указаны по Москве (МСК, UTC+3). В Калининграде (UTC+2) дедлайн наступит в 22:59 того же дня
    по вашему времени [2]. Чтобы не рисковать, ориентируйтесь на московское время и сдавайте работу заранее [2].

    Если хотите перед сдачей разобрать типичные ошибки, приходите на разбор ДЗ в пятницу, 13 ноября, в 18:00 МСК —
    он как раз посвящён hw1 перед дедлайном [3].
  bad_answer: |-
    Дедлайн hw1 — 15 ноября в 23:59. Сегодня 12 ноября, так что у тебя ровно 3 дня, успеешь!
  why_bad: |-
    Не сказано, что время московское: в Калининграде дедлайн наступает в 22:59 по местному, а студент будет
    ориентироваться на 23:59 и опоздает. Дни посчитаны моделью «на глаз», а их считает система по данным LMS.
    Нет ссылок на LMS и FAQ.

